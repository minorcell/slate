name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "标签 $GITHUB_REF_NAME 与 versionName $version 不一致"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SLATE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SLATE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SLATE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SLATE_KEY_PASSWORD }}
        run: |
          missing=0
          [ -n "$KEYSTORE_BASE64" ] || { echo "缺少 secret SLATE_KEYSTORE_BASE64"; missing=1; }
          [ -n "$STORE_PASSWORD" ] || { echo "缺少 secret SLATE_STORE_PASSWORD"; missing=1; }
          [ -n "$KEY_ALIAS" ] || { echo "缺少 secret SLATE_KEY_ALIAS"; missing=1; }
          [ -n "$KEY_PASSWORD" ] || { echo "缺少 secret SLATE_KEY_PASSWORD"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/slate.keystore"

      - name: Test and assemble
        env:
          SLATE_STORE_FILE: ${{ runner.temp }}/slate.keystore
          SLATE_STORE_PASSWORD: ${{ secrets.SLATE_STORE_PASSWORD }}
          SLATE_KEY_ALIAS: ${{ secrets.SLATE_KEY_ALIAS }}
          SLATE_KEY_PASSWORD: ${{ secrets.SLATE_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease --no-daemon

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "slate-${version}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "slate-${version}-mapping.txt"
          gh release create "$GITHUB_REF_NAME" \
            "slate-${version}.apk" \
            "slate-${version}-mapping.txt" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
